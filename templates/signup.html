    body{
        background: linear-gradient(135deg, #eef3ff, #f8f9fa);
    }

    .signup-card{
        border-radius:16px;
        box-shadow:0 15px 35px rgba(0,0,0,0.1);
    }

    .form-control{
        height:48px;
    }

    .btn-success{
        height:48px;
        font-weight:600;
    }
</style>

<div class="container d-flex align-items-center justify-content-center" style="min-height:70vh;">
  <div class="col-md-4 col-sm-8">

```
<div class="card signup-card p-4 bg-white">

  <div class="text-center mb-4">
    <h3 class="fw-bold">Create Your Account</h3>
    <p class="text-muted">
      Join the AI Career Counseling platform
    </p>
  </div>

  <form method="post">

    <!-- Full Name -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Full Name</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="fa-solid fa-user"></i>
        </span>
        <input type="text"
               name="name"
               class="form-control"
               placeholder="Enter your full name"
               required>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Email Address</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="fa-solid fa-envelope"></i>
        </span>
        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter your email"
               required>
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Password</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="fa-solid fa-lock"></i>
        </span>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Create a password"
               required>
      </div>
    </div>

    <div class="d-grid">
      <button class="btn btn-success">
        Create Account
      </button>
    </div>

  </form>

  <p class="text-center mt-4 mb-0">
    Already have an account?
    <a href="/login" class="fw-semibold text-decoration-none">
      Login
    </a>
  </p>

</div>
