let scores={
interest:0,
Analytical:0,
personality:0,
domain:0
}

Engineering:0,
Medical:0,
Business:0,
Arts:0,
Architecture:0,
Agriculture:0,
Education:0,
Science:0
}

let currentIndex=0

function getRandom(arr,count){
let shuffled=[...arr].sort(()=>0.5-Math.random())
return shuffled.slice(0,count)
}

let questionSet=[
...getRandom(interestQuestions,5),
...getRandom(AnalyticalQuestions[studentInterest],3),
...getRandom(personalityQuestions,4),
...getRandom(domainQuestions[studentInterest],3)
]

function loadQuestion(){

let q=questionSet[currentIndex]
let form=document.getElementById("answerForm")
form.innerHTML=""

document.getElementById("progressBar").style.width=(currentIndex/TOTAL_QUESTIONS*100)+"%"

let categoryBadge = document.getElementById("categoryBadge")

if(typeof q==="object" && q.options){

    categoryBadge.className="badge bg-primary mb-3 px-4 py-2 fs-6"
    categoryBadge.innerText="Analytical"

    document.getElementById("questionText").innerText = q.q || q

    q.options.forEach(opt=>{
        form.innerHTML+=`
        <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="answer" value="${opt}">
        <label class="form-check-label">${opt}</label>
        </div>
        `
    })

}

else{

    if(currentIndex < 5){
        categoryBadge.className="badge bg-primary mb-3 px-4 py-2 fs-6"
        categoryBadge.innerText="Interest"
    }
    else if(currentIndex < 8){
        categoryBadge.className="badge bg-primary mb-3 px-4 py-2 fs-6"
        categoryBadge.innerText="Analytical"
    }
    else if(currentIndex < 12){
        categoryBadge.className="badge bg-primary mb-3 px-4 py-2 fs-6"
        categoryBadge.innerText="Personality"
    }
    else{
        categoryBadge.className="badge bg-primary mb-3 px-4 py-2 fs-6"
        categoryBadge.innerText="Domain Knowledge"
    }

    document.getElementById("questionText").innerText = q.q || q

    let scale=["Strongly Agree","Agree","Neutral","Disagree","Strongly Disagree"]

    scale.forEach((s,i)=>{
        form.innerHTML+=`
        <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="answer" value="${5-i}">
        <label class="form-check-label">${s}</label>
        </div>
        `
    })

}

}

function nextQuestion(){

let selected=document.querySelector("input[name='answer']:checked")

if(!selected){
alert("Please select an answer")
return
}

let answer=selected.value
let q=questionSet[currentIndex]

if(typeof q==="object" && q.options){

    if(answer === q.answer){
        scores.Analytical += 10
    }

}
else{

    if(currentIndex < 5){
        scores.interest += parseInt(answer)

        if(q.domain && interestDomainScores[q.domain] !== undefined){
            interestDomainScores[q.domain] += parseInt(answer)
        }
    }

    else if(currentIndex < 8){
        scores.Analytical += parseInt(answer)
    }

    else if(currentIndex < 12){
        scores.personality += parseInt(answer)
    }

    else{
        scores.domain += parseInt(answer)
    }

}
